[project]
name = "document-analyser-agent"
version = "0.1.0"
description = "Document analyser agent for the A2A project - OCR and schema-validated extraction."
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk==0.3.6",
    "google-adk>=1.14.1",
    "python-dotenv",
    "uvicorn",
    "google-genai",
    "pydantic>=2.0.0",

    # Reading PDFs and rasterising their pages for vision OCR
    "PyMuPDF>=1.24.9",

    # Postgres-backed ADK sessions and upload tracking
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.29.0",

    # Uploads stored in S3 in production
    "boto3>=1.34.0",

    "sse-starlette>=3.4.11",
]
