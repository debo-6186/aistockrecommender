version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: finance_a2a_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finance_a2a}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finance_a2a"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finance_network

  document_analyser_agent:
    build:
      # The image needs agent_core/ and host_agent/database.py as well as the
      # agent itself, so the context is backend/, not the agent directory.
      context: .
      dockerfile: document_analyser_agent/Dockerfile
    container_name: document_analyser_agent
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_GENAI_USE_VERTEXAI=${GOOGLE_GENAI_USE_VERTEXAI:-FALSE}
      # ADK sessions, and the row the extraction is handed back on.
      - DATABASE_URL=${DATABASE_URL}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      # Where uploads are read from.
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-finance-a2a-portfolio-statements}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    ports:
      - "10003:10003"
    restart: unless-stopped
    networks:
      - finance_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  stockreport_generator_agent:
    build:
      # Needs agent_core/ and host_agent/database.py as well as the agent itself.
      context: .
      dockerfile: stockreport_generator_agent/Dockerfile
    container_name: stockreport_generator_agent
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_GENAI_USE_VERTEXAI=${GOOGLE_GENAI_USE_VERTEXAI:-FALSE}
      # ADK sessions, and the row the priced report is collected from.
      - DATABASE_URL=${DATABASE_URL}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      # The delivery webhook that actually sends the email.
      - ACTIVEPIECES_USERNAME=${ACTIVEPIECES_USERNAME}
      - ACTIVEPIECES_PASSWORD=${ACTIVEPIECES_PASSWORD}
      - ACTIVEPIECES_WEBHOOK_URL=${ACTIVEPIECES_WEBHOOK_URL}
      - STOCK_REPORT_GENERATOR_AGENT_URL=http://stockreport_generator_agent:10004
    ports:
      - "10004:10004"
    restart: unless-stopped
    networks:
      - finance_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  stockanalyser_agent:
    build:
      context: .
      dockerfile: stockanalyser_agent/Dockerfile
    container_name: stockanalyser_agent
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_GENAI_USE_VERTEXAI=${GOOGLE_GENAI_USE_VERTEXAI:-FALSE}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finance_a2a}
      - MCP_DIRECTORY=/app/finhub-mcp
      - ENVIRONMENT=production
      # Delivery is the report generator's job now.
      - STOCK_REPORT_GENERATOR_AGENT_URL=http://stockreport_generator_agent:10004
    ports:
      - "10002:10002"
    depends_on:
      postgres:
        condition: service_healthy
      stockreport_generator_agent:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - finance_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    networks:
      - finance_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  host_agent:
    build:
      context: .
      dockerfile: host_agent/Dockerfile
    container_name: host_agent
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_GENAI_USE_VERTEXAI=${GOOGLE_GENAI_USE_VERTEXAI:-FALSE}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finance_a2a}
      - REDIS_URL=redis://redis:6379
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON}
      - FIREBASE_SERVICE_ACCOUNT_PATH=${FIREBASE_SERVICE_ACCOUNT_PATH}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - FREE_USER_MESSAGE_LIMIT=${FREE_USER_MESSAGE_LIMIT:-30}
      - ACTIVEPIECES_USERNAME=${ACTIVEPIECES_USERNAME}
      - ACTIVEPIECES_PASSWORD=${ACTIVEPIECES_PASSWORD}
      - STOCK_ANALYSER_AGENT_URL=http://stockanalyser_agent:10002
      - DOCUMENT_ANALYSER_AGENT_URL=http://document_analyser_agent:10003
      - MCP_DIRECTORY=/app/finhub-mcp
    ports:
      - "127.0.0.1:10001:10001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      stockanalyser_agent:
        condition: service_healthy
      document_analyser_agent:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - finance_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      host_agent:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - finance_network

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  finance_network:
    driver: bridge
